<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 500" width="700" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8c959f"/>
    </marker>
    <style>
      .node { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.2; }
      .title { font-size: 14px; font-weight: 600; fill: #24292f; }
      .mono { font-size: 12.5px; fill: #24292f; font-family: Consolas, monospace; }
      .detail { font-size: 12.5px; fill: #57606a; }
      .edge { stroke: #8c959f; stroke-width: 1.4; fill: none; }
      .label { font-size: 12.5px; fill: #57606a; paint-order: stroke; stroke: #ffffff; stroke-width: 4; }
    </style>
  </defs>

  <!-- client -->
  <rect class="node" x="230" y="16" width="240" height="58" rx="8"/>
  <text class="title" x="350" y="40" text-anchor="middle">Claude Code / Codex</text>
  <text class="detail" x="350" y="59" text-anchor="middle">Windows</text>

  <path class="edge" d="M 350 74 V 132" marker-end="url(#arrow)"/>
  <text class="label" x="350" y="108" text-anchor="middle">stdio JSON-RPC over SSH</text>

  <!-- server -->
  <rect class="node" x="180" y="138" width="340" height="98" rx="8"/>
  <text class="title" x="350" y="163" text-anchor="middle">WordPress 主机(如树莓派)</text>
  <text class="mono" x="350" y="186" text-anchor="middle">/home/pi/wordpress-mcp</text>
  <text class="detail" x="350" y="207" text-anchor="middle">按需进程:venv/bin/python -m wordpress_mcp</text>

  <path class="edge" d="M 350 236 V 294" marker-end="url(#arrow)"/>
  <text class="label" x="350" y="270" text-anchor="middle">Basic Auth:专用用户 mcp_agent(editor 角色)的应用密码</text>

  <!-- loopback endpoint -->
  <rect class="node" x="190" y="300" width="320" height="76" rx="8"/>
  <text class="mono" x="350" y="326" text-anchor="middle">https://127.0.0.1:8443</text>
  <text class="detail" x="350" y="348" text-anchor="middle">nginx 回环自签 TLS,独立站点块,无缓存</text>

  <path class="edge" d="M 350 376 V 432" marker-end="url(#arrow)"/>

  <!-- wordpress -->
  <rect class="node" x="230" y="438" width="240" height="42" rx="8"/>
  <text class="title" x="350" y="464" text-anchor="middle">WordPress REST API(wp/v2)</text>
</svg>
