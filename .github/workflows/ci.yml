name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: install test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt "pytest>=8,<10"

      - name: python compileall
        run: |
          python -m compileall -q wordpress_mcp tests setup
          python -m py_compile wordpress_mcp/*.py tests/*.py tests/unit/*.py

      - name: unit tests
        run: python -m pytest -q

      - name: validate pyproject
        run: python -c "import tomllib; tomllib.load(open('pyproject.toml', 'rb'))"

      - name: shellcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck install.sh uninstall.sh deploy.sh bin/mcp-server

      - name: validate env template
        run: |
          grep -q '^MCP_SSH_HOST=' .env.example
          grep -q '^MCP_SERVER_DIR=' .env.example

      - name: validate json example
        run: python -c "import json; json.load(open('examples/wordpress-blog.mcp.json'))"
